<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Geometry Dash MVP</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #0f172a;
        font-family: Arial, sans-serif;
        color: white;
    }

    canvas {
        display: block;
        margin: auto;
        background: linear-gradient(#0f172a, #020617);
    }

    #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 20px;
    }

    #gameOver {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        text-align: center;
    }

    button {
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
    }
</style>
</head>
<body>

<div id="ui">Score: <span id="score">0</span></div>

<div id="gameOver">
    <h1>Game Over</h1>
    <button onclick="restartGame()">Restart</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gravity = 0.5;
let gameSpeed = 6;

let gameOver = false;
let score = 0;
let frame = 0;

// 🎮 PLAYER
class Player {
    constructor() {
        this.x = 100;
        this.y = canvas.height - 100;
        this.size = 40;
        this.velocityY = 0;
        this.jumpForce = -14;
        this.onGround = true;
    }

    jump() {
        if (this.onGround) {
            this.velocityY = this.jumpForce;
            this.onGround = false;
        }
    }

    update() {
        this.velocityY += gravity;
        this.y += this.velocityY;

        if (this.y >= canvas.height - 100) {
            this.y = canvas.height - 100;
            this.velocityY = 0;
            this.onGround = true;
        }
    }

    draw() {
        ctx.fillStyle = "#22c55e";
        ctx.fillRect(this.x, this.y - this.size, this.size, this.size);
    }
}

// 🧱 OBSTACLES
class Obstacle {
    constructor(type) {
        this.x = canvas.width;
        this.type = type;

        if (type === "small") {
            this.width = 40;
            this.height = 40;
        } else if (type === "tall") {
            this.width = 40;
            this.height = 80;
        } else if (type === "block") {
            this.width = 60;
            this.height = 60;
        }

        this.y = canvas.height - 100;
    }

    update() {
        this.x -= gameSpeed;
    }

    draw() {
        ctx.fillStyle = "#ef4444";

        if (this.type === "block") {
            ctx.fillRect(this.x, this.y - this.height, this.width, this.height);
        } else {
            // spikes
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + this.width/2, this.y - this.height);
            ctx.lineTo(this.x + this.width, this.y);
            ctx.closePath();
            ctx.fill();
        }
    }
}

let player = new Player();
let obstacles = [];

// 🎯 SMART SPAWNING SYSTEM
let nextSpawn = 0;

function spawnObstacle() {
    if (frame > nextSpawn) {

        const types = ["small", "tall", "block"];
        const type = types[Math.floor(Math.random() * types.length)];

        obstacles.push(new Obstacle(type));

        // 🧠 Dynamic spacing (VERY IMPORTANT)
        let minGap = 250; // minimum safe distance
        let randomGap = Math.random() * 200;

        nextSpawn = frame + minGap + randomGap;
    }
}

// ✅ COLLISION (IMPROVED)
function detectCollision(p, o) {
    const padding = 6;

    const playerLeft = p.x + padding;
    const playerRight = p.x + p.size - padding;
    const playerTop = p.y - p.size + padding;
    const playerBottom = p.y - padding;

    const obstacleLeft = o.x;
    const obstacleRight = o.x + o.width;
    const obstacleTop = o.y - o.height;
    const obstacleBottom = o.y;

    return (
        playerRight > obstacleLeft &&
        playerLeft < obstacleRight &&
        playerBottom > obstacleTop &&
        playerTop < obstacleBottom
    );
}

function update() {
    if (gameOver) return;

    frame++;
    player.update();
    spawnObstacle();

    obstacles.forEach((obs, index) => {
        obs.update();

        if (detectCollision(player, obs)) {
            endGame();
        }

        if (obs.x + obs.width < 0) {
            obstacles.splice(index, 1);
            score++;
        }
    });
}

function drawGround() {
    ctx.fillStyle = "#334155";
    ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawGround();
    player.draw();
    obstacles.forEach(obs => obs.draw());
}

function gameLoop() {
    update();
    draw();

    document.getElementById("score").innerText = score;

    requestAnimationFrame(gameLoop);
}

function endGame() {
    gameOver = true;
    document.getElementById("gameOver").style.display = "block";
}

function restartGame() {
    player = new Player();
    obstacles = [];
    score = 0;
    frame = 0;
    nextSpawn = 0;
    gameOver = false;
    document.getElementById("gameOver").style.display = "none";
}

// 🎮 CONTROLS
document.addEventListener("keydown", e => {
    if (e.code === "Space") player.jump();
});

document.addEventListener("click", () => player.jump());
document.addEventListener("touchstart", () => player.jump());

gameLoop();
</script>
</body>
</html>
